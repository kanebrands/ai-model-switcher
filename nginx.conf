events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        server_name _;
        client_max_body_size 16m;
        location = /_active_llm {
            internal;
            proxy_pass http://gpu-control:8001/route;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        location / {
            set $api_gateway fairness-gateway:8002;
            proxy_pass http://$api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
        location /vision/v1/ {
            set $api_gateway fairness-gateway:8002;
            proxy_pass http://$api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }
    server {
        listen 3000;
        server_name _;
        client_max_body_size 16m;
        location / {
            proxy_pass http://open-webui:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
    server {
        listen 3001;
        server_name _;
            auth_basic "AI Model Switcher";
        auth_basic_user_file /etc/nginx/.htpasswd;
        location / {
            proxy_pass http://gpu-control:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
            proxy_buffering off;
        }
    }
    server {
        listen 8188;
        server_name _;
        auth_basic "ComfyUI";
        auth_basic_user_file /etc/nginx/.htpasswd;
        client_max_body_size 512m;
        location / {
            set $comfy_upstream comfyui:8188;
            proxy_pass http://$comfy_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Authorization "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
